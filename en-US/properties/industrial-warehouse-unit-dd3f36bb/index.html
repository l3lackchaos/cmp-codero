.form-input,

.form-input:focus,

.form-textarea {

  min-height: 100px;
}

.form-checkbox-wrapper {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}

.form-checkbox,
.form-radio,
.form-consent {
  width: 1.125rem;
  height: 1.125rem;
  margin-top: 0.125rem;
  cursor: pointer;
}

.form-checkbox-wrapper .form-label {
  margin-bottom: 0;
  font-weight: 400;
  cursor: pointer;
}

.form-radio-group {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.form-radio-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.form-radio-option label {
  cursor: pointer;
  font-weight: 400;
}

.form-file {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  font-size: 1rem;
  cursor: pointer;
}

.form-help-text {
  margin-top: 0.375rem;
  font-size: 0.875rem;
  color: #6b7280;
}

.form-captcha {
  margin-top: 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: center;
}

.form-actions {
  margin-top: 2rem;
}

.form-submit {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 0.375rem;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
}

.form-submit:hover {
  transform: translateY(-1px);
}

.form-submit:active {
  transform: translateY(0);
}

.form-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

  },

/* === components/seo/seo.js === */
/**
 * SEO / Schema Component
 * Dynamically generates and injects structured data for SEO
 */

class SchemaGenerator {
  constructor() {
    this.apiHost =
      typeof API_CONFIG !== "undefined"
        ? API_CONFIG.host
        : "svc.uk.uforge.build";
    this.apiSegment =
      typeof API_CONFIG !== "undefined" ? API_CONFIG.segment : "api/v1";
    this.baseUrl =
      typeof API_CONFIG !== "undefined"
        ? API_CONFIG.baseUrl
        : `https://${this.apiHost}/${this.apiSegment}`;
    this.jobsUrl =
      typeof API_CONFIG !== "undefined"
        ? API_CONFIG.jobsUrl
        : `https://${this.apiHost}/${this.apiSegment}`;
    this.siteUrl = window.location.origin;
    this.pagePath = window.location.pathname;
  }

  /**
   * Inject schema into head
   */
  injectSchema(schema) {
    const scriptTag = document.createElement("script");
    scriptTag.type = "application/ld+json";
    scriptTag.textContent = JSON.stringify(schema, null, 2);
    scriptTag.id = "json-ld-schema";

    const existing = document.getElementById("json-ld-schema");
    if (existing) existing.remove();

    document.head.appendChild(scriptTag);
  }

  /**
   * Get page type based on current URL
   */
  getPageType() {
    if (this.pagePath.includes("index") || this.pagePath.endsWith("/")) {
      return "home";
    } else if (this.pagePath.includes("search")) {
      return "search";
    } else if (this.pagePath.includes("detail")) {
      return "detail";
    } else if (this.pagePath.includes("applynow")) {
      return "apply";
    } else if (this.pagePath.includes("thankyou")) {
      return "thankyou";
    }
    return "default";
  }

  generateOrganizationSchema() {
    return {
      "@context": "https://schema.org",
      "@type": "Organization",
      name: "Getmehired",
      url: this.siteUrl,
      logo: `${this.siteUrl}/img/GetMeHired_logo.svg`,
      description:
        "Job board connecting talent with top companies across the country",
      contactPoint: {
        "@type": "ContactPoint",
        contactType: "Customer Support",
        availableLanguage: "en",
      },
    };
  }

  generateWebsiteSchema() {
    return {
      "@context": "https://schema.org",
      "@type": "WebSite",
      name: "Getmehired - Job Board",
      url: this.siteUrl,
      potentialAction: {
        "@type": "SearchAction",
        target: {
          "@type": "EntryPoint",
          urlTemplate: `${this.siteUrl}/search?search={search_term_string}`,
        },
        "query-input": "required name=search_term_string",
      },
    };
  }

  async generateJobPostingSchema(jobId, jobData = null) {
    try {
      let job = jobData;
      if (!job && jobId) {
        const res = await fetch(`${this.jobsUrl}/jobs/by-id/${jobId}`);
        const json = await res.json();
        job = json.data;
      }

      if (!job) return null;

      const datePosted = new Date(job.publishedAt || new Date());
      const validThrough =
        job.validThrough || job.expiresAt
          ? new Date(job.validThrough || job.expiresAt).toISOString()
          : new Date(
              datePosted.getTime() + 30 * 24 * 60 * 60 * 1000,
            ).toISOString();

      const schema = {
        "@context": "https://schema.org/",
        "@type": "JobPosting",
        title: job.title,
        description: job.body || job.summary || "",
        datePosted: datePosted.toISOString().split("T")[0],
        validThrough: validThrough,
        employmentType: job.employmentType || "FULL_TIME",
        identifier: {
          "@type": "PropertyValue",
          name: job.sourceName || job.company || "Getmehired",
          value: String(job.id),
        },
        hiringOrganization: {
          "@type": "Organization",
          name: job.sourceName || job.company || "Getmehired",
          logo: `${this.siteUrl}/img/GetMeHired_logo.svg`,
        },
        jobLocation: {
          "@type": "Place",
          address: {
            "@type": "PostalAddress",
            addressLocality: job.city || job.normalisedLocation?.city || "",
            addressRegion:
              job.state || job.normalisedLocation?.stateOrCounty || "",
            addressCountry: "US",
          },
        },
      };

      if (
        job.normalisedSalary?.min ||
        job.normalisedSalary?.max ||
        job.salaryMin ||
        job.salaryMax
      ) {
        schema.baseSalary = {
          "@type": "MonetaryAmount",
          currency: job.normalisedSalary?.currency || job.currency || "USD",
          value: {
            "@type": "QuantitativeValue",
            minValue: job.normalisedSalary?.min ?? job.salaryMin,
            maxValue: job.normalisedSalary?.max ?? job.salaryMax,
            unitText: job.normalisedSalary?.unit || job.salaryUnit || "YEAR",
          },
        };
      }

      if (job.remoteType) {
        schema.jobLocationType = "TELECOMMUTE";
        schema.applicantLocationRequirements = {
          "@type": "Country",
          name: job.country || job.normalisedLocation?.country || "USA",
        };
      }

      return schema;
    } catch (e) {
      console.error("Error generating JobPosting schema:", e);
      return null;
    }
  }

  async updateJobSchema(job) {
    const schema = await this.generateJobPostingSchema(null, job);
    if (schema) this.injectSchema(schema);
  }

  async generateSearchResultsSchema(searchTerm = "") {
    try {
      const res = await fetch(`${this.jobsUrl}/jobs?limit=10`);
      const json = await res.json();
      const jobs = json.data || [];

      return {
        "@context": "https://schema.org",
        "@type": "SearchResultsPage",
        name: `Search Jobs - Getmehired${searchTerm ? ` for "${searchTerm}"` : ""}`,
        mainEntity: {
          "@type": "ItemList",
          numberOfItems: jobs.length,
          itemListElement: jobs.map((job, index) => ({
            "@type": "ListItem",
            position: index + 1,
            name: job.title,
            url: `${this.siteUrl}/detail?id=${job.id}`,
          })),
        },
      };
    } catch (e) {
      console.error("Error generating SearchResults schema:", e);
      return null;
    }
  }

  async init() {
    const pageType = this.getPageType();
    try {
      switch (pageType) {
        case "home":
          this.injectSchema(this.generateWebsiteSchema());
          break;
        case "search":
          const searchParams = new URLSearchParams(window.location.search);
          const searchTerm = searchParams.get("search") || "";
          const searchSchema =
            await this.generateSearchResultsSchema(searchTerm);
          if (searchSchema) this.injectSchema(searchSchema);
          break;
        case "detail":
          break;
        default:
          this.injectSchema(this.generateOrganizationSchema());
      }
    } catch (e) {
      console.error("Schema initialization error:", e);
    }
  }
}

/**
 * Navigation Component
 * Handles mobile hamburger menu and sticky navbar scrolling
 */

function initHamburgerMenu() {
  const hamburgerBtn = document.getElementById("hamburger-btn");
  const mobileMenu = document.getElementById("mobile-menu");
  const nav = document.querySelector('nav[role="navigation"]');
  const headerBgClass = "bg-[url('img/bg_header.png')]";
  const headerRepeatClass = "bg-repeat-y";

  if (!hamburgerBtn || !mobileMenu || !nav) return;

  function toggleMobileMenu() {
    const isExpanded = hamburgerBtn.getAttribute("aria-expanded") === "true";
    hamburgerBtn.setAttribute("aria-expanded", (!isExpanded).toString());

    if (!isExpanded) {
      mobileMenu.classList.remove("max-h-0", "py-0");
      mobileMenu.classList.add("max-h-96", "py-4");
    } else {
      mobileMenu.classList.remove("max-h-96", "py-4");
      mobileMenu.classList.add("max-h-0", "py-0");
    }

    // Mutate the existing <path> in place (setAttribute, not innerHTML) - replacing the
    // node here would detach the click event's own target mid-bubble, which fools the
    // "close on outside click" listener below into thinking the click landed outside the
    // button (it checks hamburgerBtn.contains(event.target), and a just-removed node is
    // contained by nothing) - causing the menu to open and immediately re-close itself.
    const icon = hamburgerBtn.querySelector("svg");
    const path = icon && icon.querySelector("path");
    if (icon && path) {
      if (!isExpanded) {
        icon.setAttribute("viewBox", "0 0 384 512");
        path.setAttribute(
          "d",
          "M55.1 73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L147.2 256 9.9 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192.5 301.3 329.9 438.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.8 256 375.1 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192.5 210.7 55.1 73.4z",
        );
      } else {
        icon.setAttribute("viewBox", "0 0 448 512");
        path.setAttribute(
          "d",
          "M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z",
        );
      }
    }
  }

  hamburgerBtn.addEventListener("click", toggleMobileMenu);

  // Close menu when clicking outside
  document.addEventListener("click", function (event) {
    if (
      !hamburgerBtn.contains(event.target) &&
      !mobileMenu.contains(event.target)
    ) {
      if (mobileMenu.classList.contains("max-h-96")) {
        toggleMobileMenu();
      }
    }
  });

  // Close menu when link is clicked
  mobileMenu.addEventListener("click", function (event) {
    if (event.target.tagName === "A") {
      toggleMobileMenu();
    }
  });

  // Sticky Scroll Effect
  window.addEventListener("scroll", function () {
    if (window.scrollY > 20) {
      nav.classList.remove(headerBgClass, headerRepeatClass);
    } else {
      nav.classList.add(headerBgClass, headerRepeatClass);
    }
  });
}

  const params = new URLSearchParams(window.location.search);
  const filters = {

    location: "search-location",
    category: "filter-category",
    employmentType: "filter-type",
    experience: "filter-experience",
    remoteType: "filter-remote",

  const orderParam = params.get("sortOrder");
  if (orderParam) {
    currentSortOrder = orderParam;
    updateSortIcon();
  }

  for (const [param, id] of Object.entries(filters)) {

  }

/**
 * Populate filter dropdowns with API data
 */
function populateFilters(data) {
  const cat = document.getElementById("filter-category");
  const typ = document.getElementById("filter-type");
  const exp = document.getElementById("filter-experience");
  const rem = document.getElementById("filter-remote");
  const com = document.getElementById("filter-company");
  const loc = document.getElementById("filter-location-dropdown");

  // Support both plural (legacy/mock) and singular (production API) field names
  const categories = data.categories || data.category;
  const employmentTypes = data.employmentTypes || data.employmentType;
  const experience = data.experience;
  const remoteTypes = data.remoteTypes || data.remoteType;
  const companies = data.companies || data.company;
  // Production API returns city/country separately; merge them into a single locations list
  const locations = data.locations || data.city || data.country;

  if (categories && cat) {
    cat.innerHTML =
      '<option value="">Categories</option>' +
      categories
        .map(
          (c) => `<option value="${c.value}">${c.value} (${c.count})</option>`,
        )
        .join("");
  }

  if (employmentTypes && typ) {
    typ.innerHTML =
      '<option value="">Job Types</option>' +
      employmentTypes
        .map(
          (t) => `<option value="${t.value}">${t.value} (${t.count})</option>`,
        )
        .join("");

  if (experience && exp) {
    exp.innerHTML =
      '<option value="">Experience</option>' +
      experience
        .map(
          (e) => `<option value="${e.value}">${e.value} (${e.count})</option>`,
        )
        .join("");
  }

  if (remoteTypes && rem) {
    rem.innerHTML =
      '<option value="">Remote Type</option>' +
      remoteTypes
        .map(
          (r) => `<option value="${r.value}">${r.value} (${r.count})</option>`,
        )
        .join("");
  }

  if (companies && com) {
    com.innerHTML =
      '<option value="">Company</option>' +
      companies
        .map(
          (c) => `<option value="${c.value}">${c.value} (${c.count})</option>`,
        )
        .join("");
  }

  if (locations && loc) {
    loc.innerHTML =
      '<option value="">Location</option>' +
      locations
        .map(
          (l) => `<option value="${l.value}">${l.value} (${l.count})</option>`,
        )
        .join("");
  }

  const keywordsDiv = document.getElementById("popular-keywords");
  if (data.tags && keywordsDiv) {
    keywordsDiv.innerHTML =
      "<span>Popular Keywords:</span>" +
      data.tags
        .slice(0, 6)
        .map(

                    ${tag.value}
                </button>
            `,
        )
        .join("");
  }
}

                        </div>
                    </div>
                `.repeat(6);
      } else {
        jobGrid.className =
          "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
        jobGrid.innerHTML = skeletonTemplate.innerHTML;
      }
    }
  } else {
    currentPage = page;
  }

  // Build query params
  const params = new URLSearchParams();
  const search = document.getElementById("search-title")?.value;
  const locationTxt = document.getElementById("search-location")?.value;

  const category = document.getElementById("filter-category")?.value;
  const type = document.getElementById("filter-type")?.value;
  const experience = document.getElementById("filter-experience")?.value;
  const remote = document.getElementById("filter-remote")?.value;
  const company = document.getElementById("filter-company")?.value;

  if (search) params.append("search", search);
  if (locationTxt) params.append("location", locationTxt);
  if (category) params.append("category", category);
  if (type) params.append("employmentType", type);
  if (experience) params.append("experience", experience);
  if (remote) params.append("remoteType", remote);
  if (company) params.append("company", company);

  // Redirect to search.html if search is triggered from the portal page (index.html)
  if (
    !isSearchPage &&
    (search ||
      locationTxt ||
      category ||
      type ||
      experience ||
      remote ||
      company)
  ) {
    const searchUrl = new URL("search", window.location.href);
    searchUrl.search = params.toString();
    window.location.href = searchUrl.toString();
    return;
  }

  params.append("page", currentPage);
  params.append("limit", limit);

  const sortBy = document.getElementById("sort-by")?.value || "publishedAt";
  const sortOrder = currentSortOrder;

  params.append("sortBy", sortBy);
  params.append("sortOrder", sortOrder);

  // Update URL without refreshing if on search page
  if (isSearchPage && page === 1) {
    const url = new URL(window.location);
    params.forEach((value, key) => {
      if (["page", "limit", "sortBy", "sortOrder"].includes(key)) return;
      url.searchParams.set(key, value);
    });
    // Remove empty params
    for (const key of Array.from(url.searchParams.keys())) {
      if (
        !params.has(key) &&
        !["page", "limit", "sortBy", "sortOrder"].includes(key)
      ) {
        url.searchParams.delete(key);
      }
    }
    window.history.pushState({}, "", url);
  }

  // Show/hide clear button
  const clearBtn = document.getElementById("clear-filters");
  const hasFilters =
    search ||
    locationTxt ||
    category ||
    type ||
    experience ||
    remote ||
    company;
  if (clearBtn) clearBtn.classList.toggle("hidden", !hasFilters);

  try {
    const res = await fetch(`${API_CONFIG.jobsUrl}/jobs?${params}`);
    const json = await res.json();
    lastJobsData = json;

    if (isSearchPage) {
      renderSearchPage(json);
    } else {
      renderPortalPage(json, page > 1);
    }
  } catch (e) {
    console.error("API Fetch Error:", e);
  }
}

function renderPaginationControls(meta) {
  const containers = ["pagination-controls-top", "pagination-controls-bottom"];
  const limit = itemsPerPage;
  const totalPages = Math.ceil(meta.total / limit);

  containers.forEach((id) => {
    const container = document.getElementById(id);
    if (!container) return;

    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }

    let html = `
            <button onclick="loadJobs(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""} class="w-10 h-10 rounded-md border border-gray-200 text-gray-500 flex items-center justify-center hover:bg-gray-50 disabled:opacity-20"><svg viewBox=\"0 0 320 512\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l192 192c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256 246.6 86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-192 192z\"/></svg></button>
        `;

    for (let i = 1; i <= totalPages; i++) {
      if (
        i === 1 ||
        i === totalPages ||
        (i >= currentPage - 1 && i <= currentPage + 1)
      ) {
        html += `<button onclick="loadJobs(${i})" class="w-10 h-10 rounded-md ${i === currentPage ? "bg-brand-dark text-white" : "border border-gray-200 text-gray-600 hover:bg-gray-50"} font-medium">${i}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        html += `<span class="text-gray-400">...</span>`;
      }
    }

    html += `
            <button onclick="loadJobs(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""} class="w-10 h-10 rounded-md border border-gray-200 text-gray-500 flex items-center justify-center hover:bg-gray-50 disabled:opacity-20"><svg viewBox=\"0 0 320 512\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M311.1 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L243.2 256 73.9 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z\"/></svg></button>
        `;
    container.innerHTML = html;
  });
}

function updatePaginationInfo(meta) {
  const ids = ["pagination-info-top", "pagination-info-bottom"];
  const limit = itemsPerPage;
  const start = (currentPage - 1) * limit + 1;
  const end = Math.min(currentPage * limit, meta.total);
  const text = `Showing ${start}-${end} of ${meta.total} jobs`;

  ids.forEach((id) => {
    const info = document.getElementById(id);
    if (info) info.innerText = text;
  });
}

/**
 * Helper for human-readable dates
 */
function getTimeAgo(date) {
  if (!date) return "Recently";
  const seconds = Math.floor((new Date() - new Date(date)) / 1000);
  let interval = seconds / 31536000;
  if (interval > 1) return Math.floor(interval) + "y";
  interval = seconds / 2592000;
  if (interval > 1) return Math.floor(interval) + "mo";
  interval = seconds / 86400;
  if (interval > 1) return Math.floor(interval) + "d";
  interval = seconds / 3600;
  if (interval > 1) return Math.floor(interval) + "h";
  interval = seconds / 60;
  if (interval > 1) return Math.floor(interval) + "m";
  return "Just now";
}

/**
 * Initialize search input Enter key handling
 */
function initSearchInputs() {
  const searchInputs = ["search-title", "search-location"];

  searchInputs.forEach((id) => {
    const input = document.getElementById(id);
    if (input) {
      input.addEventListener("keypress", function (event) {

}

// Global Function to handle Save Job action
window.toggleSaveJob = function (e, jobId) {
  e.preventDefault();
  e.stopPropagation();

  jobId = String(jobId);
  let savedJobs = JSON.parse(localStorage.getItem("savedJobs")) || [];
  const btn = e.currentTarget;
  const icon = btn.querySelector("svg");
  const path = icon && icon.querySelector("path");

  const isNowSaved = !savedJobs.includes(jobId);
  savedJobs = isNowSaved
    ? [...savedJobs, jobId]
    : savedJobs.filter((id) => id !== jobId);

  if (icon && path) {
    path.setAttribute(
      "d",
      isNowSaved ? BOOKMARK_PATHS.solid : BOOKMARK_PATHS.regular,
    );
    icon.style.color = isNowSaved ? "#ec4899" : "";
  }

  localStorage.setItem("savedJobs", JSON.stringify(savedJobs));
};

/**
 * Job Detail Component
 * Handles fetching and rendering job details for both standalone and split-view modes
 */

/**
 * Handle Standalone Job Detail Page (detail.html)
 */
async function loadJobDetailStandalone() {
  const detailView = document.getElementById("detail-view");
  const loadingView = document.getElementById("loading-view");

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get("id");

  if (!id) {
    if (loadingView)
      loadingView.innerHTML =
        '<div class="text-red-600 font-bold">No Job ID provided. <a href="search" class="underline">Back to search</a></div>';
    return;
  }

  try {
    const res = await fetch(`${JOBS_URL}/jobs/by-id/${id}`);
    const json = await res.json();
    const job = json.data;

    if (!job) throw new Error("Job not found");

    // Populate Fields
    const companyName = job.sourceName || job.company || "Unknown Company";
    const titleEl = document.getElementById("job-title");
    const companyEl = document.getElementById("job-company");
    const companySmallEl = document.getElementById("company-name-small");
    const locEl = document.getElementById("job-location");
    const salEl = document.getElementById("job-salary");
    const dateEl = document.getElementById("job-date");
    const logoEl = document.getElementById("job-logo");
    const logoSmallEl = document.getElementById("company-logo-small");
    const typeTag = document.getElementById("job-type-tag");
    const remoteTag = document.getElementById("job-remote-tag");
    const descEl = document.getElementById("job-description");
    const applyBtn = document.getElementById("apply-btn-main");

    if (titleEl) titleEl.innerText = job.title;
    if (companyEl) companyEl.innerText = companyName;
    if (companySmallEl) companySmallEl.innerText = companyName;
    if (locEl) locEl.innerText = job.location || "Remote";
    if (salEl)
      salEl.innerText =
        job.normalisedSalary?.rawInput || job.salary || "Competitive";
    if (dateEl)
      dateEl.innerText = `Posted ${typeof getTimeAgo === "function" ? getTimeAgo(job.publishedAt) : "Recently"}`;

    const logoText = (companyName || "J")[0];
    if (logoEl) logoEl.innerText = logoText;
    if (logoSmallEl) logoSmallEl.innerText = logoText;

    if (typeTag) typeTag.innerText = job.employmentType || "Full-time";

    if (remoteTag) {
      if (job.remoteType) {
        remoteTag.innerText = job.remoteType;
        remoteTag.classList.remove("hidden");
      } else {
        remoteTag.classList.add("hidden");
      }
    }

    if (descEl)
      descEl.innerHTML = job.body || job.summary || "No description provided.";
    if (applyBtn) applyBtn.href = `application?jobId=${job.id}`;

    // Initialize Share Buttons
    const nativeBtn = document.getElementById("share-native-btn");
    const cpBtn = document.getElementById("share-copy-btn");

    if (nativeBtn)
      nativeBtn.onclick = () => shareJob("native", job.id, job.title);
    if (cpBtn) cpBtn.onclick = () => shareJob("copy", job.id, job.title);

    // Switch Views
    if (loadingView) loadingView.classList.add("hidden");
    if (detailView) detailView.classList.remove("hidden");

    document.title = `${job.title} - Getmehired`;

    // Update Schema dynamically
    if (typeof SchemaGenerator !== "undefined") {
      const schemaGen = new SchemaGenerator();
      schemaGen.updateJobSchema(job);
    }
  } catch (e) {
    console.error("Detail Load Error:", e);
    if (loadingView)
      loadingView.innerHTML = `<div class="text-red-600 font-bold">Failed to load job details. ${e.message}</div>`;
  }
}

/**
 * Fetch and display job details on the right column (split-view)
 */
async function openJobDetail(id) {
  if (typeof activeJobId !== "undefined") window.activeJobId = id;

  updateActiveCardUI(id);

  const detailContent = document.getElementById("job-detail-content");
  if (!detailContent) return;

  // Loading state
  detailContent.innerHTML =
    '<div class="py-20 flex flex-col items-center" aria-live="polite"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-yellow mb-2"></div><span class="text-gray-700">Loading job details...</span></div>';

  try {
    const res = await fetch(`${JOBS_URL}/jobs/by-id/${id}`);
    const json = await res.json();
    const job = json.data;

    if (!job) throw new Error("Job not found");

    renderJobDetailHTML(detailContent, job);
  } catch (e) {
    detailContent.innerHTML = `<div class="py-20 text-center text-red-700 font-bold" aria-live="assertive">Failed to load job details. Please try again.</div>`;
  }
}

/**
 * Update the UI of job cards to show which one is active
 */
function updateActiveCardUI(activeId) {
  document.querySelectorAll('[role="button"]').forEach((c) => {
    c.classList.remove("job-card-active", "border-blue-600");
    c.classList.add("border-gray-300");
    c.setAttribute("aria-pressed", "false");
  });

  if (activeId) {

/**
 * Handle sharing logic with modern APIs and fallbacks
 */
async function shareJob(platform, id, title) {
  const url = `${window.location.origin}${window.location.pathname.replace("index.html", "").replace("search.html", "").replace("detail.html", "").replace("index", "").replace("search", "").replace("detail", "")}detail?id=${id}`;
  const text = `Check out this job: ${title}`;

  // Close menu immediately
  const menu = document.getElementById("share-menu");
  if (menu) menu.classList.add("hidden");

  // Use native Web Share API if supported (mobile/modern browsers)
  if (navigator.share && platform !== "copy") {
    try {
      await navigator.share({ title: "GetMeHired", text: text, url: url });
      return;
    } catch (error) {
      // Fallback to traditional sharing if user cancels or it fails
      if (error.name !== "AbortError") console.log("Share failed:", error);
    }
  }

  // Traditional sharing fallbacks with precise popup sizing
  const windowFeatures =
    "scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no,width=600,height=500,left=100,top=100";

  if (platform === "facebook") {
    window.open(
      `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
      "Share",
      windowFeatures,
    );
  } else if (platform === "twitter") {
    window.open(
      `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
      "Share",
      windowFeatures,
    );
  } else if (platform === "copy") {
    try {
      await navigator.clipboard.writeText(url);
      showInteractionToast("Job link copied to clipboard!");
    } catch (err) {
      console.warn(
        "Clipboard API blocked (likely HTTP local). Using fallback...",
        err,
      );
      // Fallback for local/HTTP test environments
      try {
        const textArea = document.createElement("textarea");
        textArea.value = url;
        // Move out of view so it doesn't cause page jump
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();
        showInteractionToast("Job link copied to clipboard!");
      } catch (fallbackErr) {
        console.error("Fallback copy failed: ", fallbackErr);
      }
    }
  }
}

/**
 * Modern Toast Notification
 */
function showInteractionToast(message) {
  // Remove existing toast if present
  const existing = document.getElementById("interaction-toast");
  if (existing) existing.remove();

  const toast = document.createElement("div");
  toast.id = "interaction-toast";
  toast.className =
    "fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-[100] text-sm font-bold flex items-center transition-all duration-300 opacity-0 translate-y-4";
  toast.innerHTML = `<svg viewBox=\"0 0 512 512\" class=\"text-green-400 mr-2\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zM374 145.7c-10.7-7.8-25.7-5.4-33.5 5.3L221.1 315.2 169 263.1c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l72 72c5 5 11.8 7.5 18.8 7s13.4-4.1 17.5-9.8L379.3 179.2c7.8-10.7 5.4-25.7-5.3-33.5z\"/></svg> ${message}`;

  document.body.appendChild(toast);

  // Trigger animation in
  requestAnimationFrame(() => {
    toast.classList.remove("opacity-0", "translate-y-4");
  });

  // Trigger animation out
  setTimeout(() => {
    toast.classList.add("opacity-0", "translate-y-4");
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/**
 * Theme Switcher Component
 * Handles Accessibility Menu, Dark Mode, and High Contrast
 */

function toggleAccPanel(shouldFocus = false) {
  const panel = document.getElementById("acc-panel");
  if (!panel) return;

  const isShowing = panel.classList.toggle("show");

  if (isShowing && shouldFocus) {
    // Delay focus slightly to ensure panel is rendered
    setTimeout(() => {
      const darkBtn = document.getElementById("dark-mode-btn");
      if (darkBtn) darkBtn.focus();
    }, 100);
  }
}

/**
 * Update button colors based on accessibility mode
 */
function updateButtonColors(mode) {
  const actionBtns = [
    document.getElementById("save-job-btn"),
    document.getElementById("share-job-btn"),
  ];

  actionBtns.forEach((btn) => {
    if (!btn) return;

    if (mode === "dark") {
      btn.classList.remove(
        "border-gray-200",
        "text-brand-dark",
        "hover:bg-gray-50",
        "bg-white",
      );
      btn.classList.add(
        "border-slate-600",
        "text-slate-100",
        "hover:bg-slate-700",
        "bg-slate-800",
      );
    } else if (mode === "high-contrast") {
      btn.classList.remove(
        "border-gray-200",
        "text-brand-dark",
        "hover:bg-gray-50",
        "border-slate-600",
        "text-slate-100",
        "hover:bg-slate-700",
        "bg-slate-800",
        "bg-white",
      );
      btn.classList.add(
        "border-black",
        "text-black",
        "hover:bg-black",
        "hover:text-white",
        "bg-white",
      );
      btn.style.borderWidth = "2px";
      btn.style.fontWeight = "700";
    } else {
      // Normal mode
      btn.classList.remove(
        "border-slate-600",
        "text-slate-100",
        "hover:bg-slate-700",
        "border-black",
        "text-black",
        "hover:bg-black",
        "hover:text-white",
        "bg-slate-800",
      );
      btn.classList.add(
        "border-gray-200",
        "text-brand-dark",
        "hover:bg-gray-50",
        "bg-white",
      );
      btn.style.borderWidth = "";
      btn.style.fontWeight = "";
    }
  });
}

/**
 * Update logo images based on accessibility mode
 */
function updateLogo(mode) {
  const logos = document.querySelectorAll('img[src*="GetMeHired_logo"]');
  logos.forEach((img) => {
    const currentSrc = img.src;
    let newSrc;

    if (mode === "dark") {
      newSrc = currentSrc.replace(
        "GetMeHired_logo.svg",
        "GetMeHired_logo-dark-mode.svg",
      );
    } else if (mode === "high-contrast") {
      newSrc = currentSrc.replace(
        "GetMeHired_logo.svg",
        "GetMeHired_logo-blind.svg",
      );
    } else {
      // Default/normal mode
      newSrc = currentSrc
        .replace("GetMeHired_logo-dark-mode.svg", "GetMeHired_logo.svg")
        .replace("GetMeHired_logo-blind.svg", "GetMeHired_logo.svg");
    }

    if (newSrc !== currentSrc) {
      img.src = newSrc;
    }
  });
}

function toggleDarkMode() {
  const isCurrentlyDark = document.body.classList.contains("dark");

  // Prevent turning dark mode ON if high contrast is on
  if (!isCurrentlyDark && document.body.classList.contains("high-contrast")) {
    return;
  }

  const isDark = document.body.classList.toggle("dark");
  const toggle = document.getElementById("dark-mode-toggle");
  if (!toggle) return;

  const btn = toggle.parentElement;

  if (isDark) {
    toggle.classList.replace("translate-x-0", "translate-x-5");
    btn.classList.replace("bg-gray-200", "bg-blue-600");
    updateLogo("dark");
    updateButtonColors("dark");
  } else {
    toggle.classList.replace("translate-x-5", "translate-x-0");
    btn.classList.replace("bg-blue-600", "bg-gray-200");
    updateLogo("normal");
    updateButtonColors("normal");
  }
  localStorage.setItem("dark-mode", isDark);
}

function toggleHighContrast() {
  const isHigh = document.body.classList.toggle("high-contrast");
  const toggle = document.getElementById("contrast-toggle");
  if (!toggle) return;

  const btn = toggle.parentElement;
  const darkToggleBtn = document.getElementById("dark-mode-btn");

  if (isHigh) {
    toggle.classList.replace("translate-x-0", "translate-x-5");
    btn.classList.replace("bg-gray-200", "bg-blue-600");

    // Turn off dark mode if it's on
    if (document.body.classList.contains("dark")) {
      toggleDarkMode();
    }

    // Disable dark mode switch
    if (darkToggleBtn) {
      darkToggleBtn.disabled = true;
      darkToggleBtn.style.opacity = "0.5";
      darkToggleBtn.style.cursor = "not-allowed";
      darkToggleBtn.setAttribute("aria-disabled", "true");
    }

    updateLogo("high-contrast");
    updateButtonColors("high-contrast");
  } else {
    toggle.classList.replace("translate-x-5", "translate-x-0");
    btn.classList.replace("bg-blue-600", "bg-gray-200");

    // Re-enable dark mode switch
    if (darkToggleBtn) {
      darkToggleBtn.disabled = false;
      darkToggleBtn.style.opacity = "1";
      darkToggleBtn.style.cursor = "pointer";
      darkToggleBtn.removeAttribute("aria-disabled");
    }

    // Restore appropriate logo (dark mode or normal)
    const isDark = document.body.classList.contains("dark");
    updateLogo(isDark ? "dark" : "normal");
    updateButtonColors(isDark ? "dark" : "normal");
  }
  localStorage.setItem("high-contrast", isHigh);
}

// Global keyboard shortcuts
window.addEventListener("keydown", (e) => {
  // Alt + A to toggle accessibility menu
  if (e.altKey && e.key.toLowerCase() === "a") {
    e.preventDefault();
    toggleAccPanel(true);
  }
});

// Load accessibility preferences
window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("dark-mode") === "true") toggleDarkMode();
  if (localStorage.getItem("high-contrast") === "true") toggleHighContrast();
});

/**
 * Close accessibility panel when clicking outside
 */
document.addEventListener("click", (event) => {
  const panel = document.getElementById("acc-panel");
  const accMenu = document.getElementById("accessibility-menu");

  if (!panel || !accMenu) return;

  if (panel.classList.contains("show") && !accMenu.contains(event.target)) {
    panel.classList.remove("show");
  }
});

/**
 * Screening Page Component
 * Handles URL parameter parsing, job detail fetching, and AI interview widget injection
 * for the candidate screening page.
 */

/**
 * Initialize the screening page.
 * Called on DOMContentLoaded.
 */
function initScreeningPage() {
  const { session, job } = parseScreeningParams();

  // Session is the primary identifier — if missing, block everything
  if (!session) {
    const loadingEl = document.getElementById("screening-loading");
    if (loadingEl) loadingEl.classList.add("hidden");
    showScreeningError(
      "screening-left-column",
      "A valid session is required to access this page.",
    );
    return;
  }

  // Job is required for the left column, but widget can still load
  if (!job) {
    const loadingEl = document.getElementById("screening-loading");
    if (loadingEl) loadingEl.classList.add("hidden");
    showScreeningError(
      "screening-left-column",
      "A valid job identifier is required to load this page.",
    );
    injectInterviewWidget(session);
    observeThemeChanges();
    return;
  }

  // Both params are valid — load job details and inject widget
  loadScreeningJobDetails(job);
  injectInterviewWidget(session);
  observeThemeChanges();
}

/**
 * Watch for theme changes on the document element and update the widget's
 * data-color-mode attribute accordingly.
 * Uses a MutationObserver to detect when the 'dark' class is added/removed.
 */
function observeThemeChanges() {
  const observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (mutation.attributeName === "class") {
        const isDark = document.documentElement.classList.contains("dark");
        const widgetScript = document.querySelector(
          'script[src*="widget.becareers.co.uk"]',
        );
        if (widgetScript) {
          widgetScript.setAttribute(
            "data-color-mode",
            isDark ? "dark" : "light",
          );
        }
      }
    });
  });
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["class"],
  });
}

/**
 * Parse and validate URL query parameters.
 * @returns {{ session: string|null, job: string|null }} Parsed parameters
 */
function parseScreeningParams() {
  const params = new URLSearchParams(window.location.search);
  const session = params.get("session") || null;
  const job = params.get("job") || null;
  return { session, job };
}

/**
 * Inject the AI interview widget script into the page.
 * @param {string} sessionSid - The session identifier from URL params
 */
function injectInterviewWidget(sessionSid) {
  const themes = getWidgetThemeConfig();
  const colorMode = document.documentElement.classList.contains("dark")
    ? "dark"
    : "light";

  const script = document.createElement("script");
  script.src = "https://widget.uk.becareers.co.uk/widget.js";
  script.setAttribute("data-interview-session", sessionSid);
  script.setAttribute("data-inject-target", "#injection-target");
  script.setAttribute("data-color-mode", colorMode);
  script.setAttribute("data-theme", JSON.stringify(themes.light));
  script.setAttribute("data-theme-dark", JSON.stringify(themes.dark));

  document.body.appendChild(script);
}

/**
 * Get the widget theme configuration objects.
 * @returns {{ light: object, dark: object }} Theme config for widget data attributes
 */
function getWidgetThemeConfig() {
  return {
    light: {
      bubbleBackground: "#feb825",
      bubbleTextColor: "#202744",
      panelBackground: "#ffffff",
      aiBubbleBackground: "#f3f4f6",
    },
    dark: {
      bubbleBackground: "#ffffff",
      headerBackground: "#202744",
      panelBackground: "#1e293b",
      aiBubbleBackground: "#334155",
    },
  };
}

/**
 * Display an error message in the specified container.
 * @param {string} containerId - DOM element ID to show error in
 * @param {string} message - Error message text
 */
function showScreeningError(containerId, message) {
  const container = document.getElementById(containerId);
  if (container) {
    container.innerHTML = `
            <div class="text-center py-12">
                <svg viewBox=\"0 0 512 512\" class=\"text-red-500 text-4xl mb-4\" aria-hidden=\"true\"><path fill=\"currentColor\" d=\"M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zm0-192a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.6 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z\"/></svg>

                <a href="search" class="text-blue-600 hover:underline text-sm mt-2 inline-block">

  }
}

        '<div class="text-red-500 font-medium">Failed to load job details.</div>';
    }
  }

  if (!applicationId) {
    resultsInfo.innerHTML = `
            <div class="results-empty">
                <svg viewBox=\"0 0 512 512\" aria-hidden="true"><path fill=\"currentColor\" d=\"M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zm0-192a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.6 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z\"/></svg>
                <p>No screening ID was provided. Please open this page from your results link.</p>
            </div>
        `;
    return;
  }

  try {
    const headers = {};
    if (accessToken) {
      headers["x-results-token"] = accessToken;
    }

    const res = await fetch(
      `${BASE_URL}/screening-results/by-id/${applicationId}`,
      { headers },
    );

    if (res.status === 404) {
      resultsInfo.innerHTML =
        '<div class="results-empty"><svg viewBox=\"0 0 512 512\" aria-hidden="true"><path fill=\"currentColor\" d=\"M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zm0-192a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.6 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z\"/></svg><p>Results not found. Your link may have expired or is no longer authorised. Please contact your recruiter for a new link.</p></div>';
      return;
    }

    const json = await res.json();
    const payload = json.data;

    if (!payload || !payload.html) {

      return;

    resultsInfo.innerHTML = payload.html;

    resultsInfo.innerHTML =
      '<div class="results-empty"><svg viewBox=\"0 0 512 512\" aria-hidden="true"><path fill=\"currentColor\" d=\"M256 512a256 256 0 1 1 0-512 256 256 0 1 1 0 512zm0-192a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.6 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z\"/></svg><p>Failed to load results. Please try again later.</p></div>';
  }
});

function renderMetadata(container, metadata) {
  if (!container || !metadata) return;

  const status = (metadata.status || "unknown").toLowerCase();
  const score =
    typeof metadata.overallScore === "number"
      ? metadata.overallScore.toFixed(metadata.overallScore % 1 === 0 ? 0 : 1)
      : null;
  const completedAt = formatCompletedDate(metadata.completedAt);

  container.hidden = false;
  container.innerHTML = `
        <div class="results-meta-grid">
            ${
              score !== null
                ? `
            <div class="results-meta-card results-meta-score">
                <p class="results-meta-label">Overall Score</p>
                <p class="results-meta-value">${escapeHtml(score)}<span class="results-meta-unit">%</span></p>
            </div>`
                : ""
            }
            <div class="results-meta-card">
                <p class="results-meta-label">Status</p>
                <p class="results-meta-value">
                    <span class="results-status results-status--${escapeHtml(status)}">${escapeHtml(formatStatus(status))}</span>
                </p>
            </div>
            ${
              completedAt
                ? `
            <div class="results-meta-card">
                <p class="results-meta-label">Completed</p>
                <p class="results-meta-value results-meta-date">${escapeHtml(completedAt)}</p>
            </div>`
                : ""
            }
        </div>
    `;
}

function formatStatus(status) {
  return status.replace(/[_-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

function formatCompletedDate(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  return date.toLocaleDateString("en-GB", {
    day: "numeric",
    month: "short",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

   * Returns {bucket, key} on success.
   */
  function uploadFile(file) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", UPLOAD_URL);

      // Track upload progress
      xhr.upload.addEventListener("progress", function (evt) {
        if (evt.lengthComputable) {
          var pct = Math.round((evt.loaded / evt.total) * 100);
          uploadText.textContent = "Uploading... " + pct + "%";
          uploadText.style.color = "#6b7280";
        }
      });

      xhr.onload = function () {
        if (xhr.status === 201) {
          try {
            var result = JSON.parse(xhr.responseText);
            resolve(result);
          } catch (e) {
            reject(new Error("Invalid upload response"));
          }
        } else if (xhr.status === 400) {
          reject(
            new Error(
              "File not accepted. Please check file type and size (max 10MB).",
            ),
          );
        } else if (xhr.status === 429) {
          reject(
            new Error("Too many uploads. Please wait a moment and try again."),
          );
        } else if (xhr.status === 404) {
          reject(
            new Error("Upload service unavailable. Please try again later."),
          );
        } else {
          reject(new Error("Upload failed. Please try again."));
        }
      };

      xhr.onerror = function () {
        reject(
          new Error(
            "Network error during upload. Please check your connection.",
          ),
        );
      };

      var formData = new FormData();
      formData.append("file", file);
      xhr.send(formData);
    });
  }

      submitBtn.disabled = true;

        // Handle file upload: upload first, then include {bucket, key} in payload
        if (cvUpload.files && cvUpload.files.length > 0) {

/**
 * Application Entry Point
 * Orchestrates the initialization of all components
 */

async function initApp() {
  // 1. Initialize SEO/Schema
  if (typeof SchemaGenerator !== "undefined") {
    const schemaGen = new SchemaGenerator();
    schemaGen.init();
  }

  // 2. Identify Page Context
  const isDetailPage = !!document.getElementById("detail-view");
  const isSearchPage = !!document.getElementById("job-grid");

  // 3. Initialize Page Specific Logic
  if (isDetailPage) {
    if (typeof loadJobDetailStandalone === "function") {
      await loadJobDetailStandalone();
    }
  } else {
    // Load Filter Presets if search functionality exists
    if (typeof loadPresets === "function") {
      await loadPresets();
    }

    // Sync filters if on search page
    if (isSearchPage && typeof syncFiltersFromUrl === "function") {
      syncFiltersFromUrl();
    }

    // Initial Job Load
    if (typeof loadJobs === "function") {
      await loadJobs();
    }
  }
}

// Global initialization call - using DOMContentLoaded for faster response
window.addEventListener("DOMContentLoaded", initApp);

      fieldWrapper.appendChild(errorDiv);

      field.parentNode.insertBefore(errorDiv, field.nextSibling);

  function clearFieldError(fieldId) {

    if (field) {

      try {
        // Collect form data
        const formData = new FormData(form);
        const data = {};

        // Get formId from hidden field or data attribute

        const idempotencyKey = (window.crypto && window.crypto.randomUUID)

        const response = await fetch('/public/forms/submit', {
