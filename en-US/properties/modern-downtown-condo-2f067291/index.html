<style type="text/css" data-source="components">
/* FunnelForge Form Base Styles */
.uf-form {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

.uf-form *,
.uf-form *::before,
.uf-form *::after {
  box-sizing: border-box;
}

.form-field {
  margin-bottom: 1.5rem;
}

.form-title {
  margin: 0 0 0.5rem 0;
  font-size: 1.5rem;
  font-weight: 600;
}

.form-description {
  margin: 0 0 1.5rem 0;
  font-size: 0.875rem;
  opacity: 0.8;
}

.form-label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 500;
}

.form-label.required::after {
  content: ' *';
  color: #dc2626;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 0.625rem 0.875rem;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  font-size: 1rem;
  line-height: 1.5;
  transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.form-input[aria-invalid="true"],
.form-select[aria-invalid="true"],
.form-textarea[aria-invalid="true"] {
  border-color: #dc2626;
}

.form-textarea {
  resize: vertical;
  min-height: 100px;
}

.form-checkbox-wrapper {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
}

.form-checkbox,
.form-radio,
.form-consent {
  width: 1.125rem;
  height: 1.125rem;
  margin-top: 0.125rem;
  cursor: pointer;
}

.form-checkbox-wrapper .form-label {
  margin-bottom: 0;
  font-weight: 400;
  cursor: pointer;
}

.form-radio-group {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.form-radio-option {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.form-radio-option label {
  cursor: pointer;
  font-weight: 400;
}

.form-file {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid #d1d5db;
  border-radius: 0.375rem;
  font-size: 1rem;
  cursor: pointer;
}

.form-help-text {
  margin-top: 0.375rem;
  font-size: 0.875rem;
  color: #6b7280;
}

.form-captcha {
  margin-top: 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: center;
}

.form-actions {
  margin-top: 2rem;
}

.form-submit {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 0.375rem;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
}

.form-submit:hover {
  transform: translateY(-1px);
}

.form-submit:active {
  transform: translateY(0);
}

.form-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* Responsive layout */
@media (max-width: 640px) {
  .form-field {
    margin-bottom: 1.25rem;
  }
  
  .form-actions {
    margin-top: 1.5rem;
  }
}

/* Default Theme */
.uf-form {
  background-color: #ffffff;
  color: #1f2937;
}

.form-input,
.form-select,
.form-textarea,
.form-file {
  border-color: #d1d5db;
  background-color: #ffffff;
  color: #1f2937;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px #3b82f61a;
}

.form-submit {
  background-color: #3b82f6;
  color: #ffffff;
}

.form-submit:hover {
  background-color: #3575dd;
}

.form-help-text {
  color: #6b7280;
}
