    function clear(){var o=mount.querySelectorAll('[data-dyn-clone]');Array.prototype.forEach.call(o,function(n){n.parentNode.removeChild(n);});}

    /** Rebuild the carousel dots; nav hides itself when there's nothing to slide. */

    }
    /** Mark the dot whose slide is nearest the track's left edge. */

  function run(){
