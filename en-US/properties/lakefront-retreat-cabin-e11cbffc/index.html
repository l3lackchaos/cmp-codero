    // Insert error message after the field or its wrapper
    const fieldWrapper = field.closest('.form-field');
    if (fieldWrapper) {
      fieldWrapper.appendChild(errorDiv);
    } else {
      field.parentNode.insertBefore(errorDiv, field.nextSibling);
    }
  }

  function clearFieldError(fieldId) {
    const field = document.getElementById(fieldId);
    if (field) {
      field.setAttribute('aria-invalid', 'false');

    const errorDiv = document.getElementById(fieldId + '-error');
    if (errorDiv) {

  }

    const existingMessage = document.querySelector('.form-message');

    // Create message element
    const messageDiv = document.createElement('div');

      // Get submit button and disable it to prevent duplicate submissions
      const submitButton = form.querySelector('button[type="submit"]');
      const originalButtonText = submitButton ? submitButton.textContent : '';
      if (submitButton) {

      try {

        // Get formId from hidden field or data attribute
        const formIdValue = form.dataset.formId || data.formId;

        const idempotencyKey = (window.crypto && window.crypto.randomUUID)

        const response = await fetch('/public/forms/submit', {
