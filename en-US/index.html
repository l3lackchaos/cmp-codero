      lm.style.cssText='margin:16px auto 0;display:none;padding:9px 18px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer';

    // A filter value is a string OR an array of them (a multi-select). Repeated

    function fromUrl(){

      Array.prototype.forEach.call(fmul,function(b){multiSync(b);});

      if(si)si.value=st.search;
    }
    // ── multi-select: a button + a panel of checkboxes the hydrator fills ──
    // Values live in st.filters[key] as an ARRAY, exactly like a repeated param,
    // so query building / URL sync / back-button need no special case.
    var fmul=el.querySelectorAll('[data-dyn-filter-multi]');
    function multiLabel(box){
      var k=box.getAttribute('data-dyn-filter-multi');

      var n=vals(st.filters[k]).length;
      btn.textContent=n?(box.getAttribute('data-dyn-multi-name')||k)+' ('+n+')':(box.getAttribute('data-dyn-multi-name')||k);
    }
    function multiSync(box){
      var k=box.getAttribute('data-dyn-filter-multi');
      var vs=vals(st.filters[k]);
      var boxes=box.querySelectorAll('input[type=checkbox]');
      Array.prototype.forEach.call(boxes,function(c){c.checked=vs.indexOf(c.value)>=0;});

    }
    Array.prototype.forEach.call(fmul,function(box){

    });
    function clear(){var o=mount.querySelectorAll('[data-dyn-clone]');Array.prototype.forEach.call(o,function(n){n.parentNode.removeChild(n);});}

      var frag=document.createDocumentFragment();
      recs.forEach(function(rec){
        var c=tpl.cloneNode(true);c.setAttribute('data-dyn-clone','');
        if(car){c.style.flex='0 0 auto';c.style.scrollSnapAlign='start';c.setAttribute('role','listitem');if(!c.style.minWidth)c.style.minWidth='260px';}
        fill(c,rec,cfg.bindings);frag.appendChild(c);
      });
      mount.appendChild(frag);
      if(car)dots();
    }
    /** Rebuild the carousel dots; nav hides itself when there's nothing to slide. */
    function dots(){
      var items=mount.querySelectorAll('[data-dyn-clone]');
      var multi=items.length>1;
      car.prev.style.display=multi?'block':'none';
      car.next.style.display=multi?'block':'none';
      car.dots.innerHTML='';
      if(!multi)return;
      Array.prototype.forEach.call(items,function(it,i){
        var d=document.createElement('button');
        d.type='button'; d.setAttribute('aria-label','Go to item '+(i+1));

      });

    }
    /** Mark the dot whose slide is nearest the track's left edge. */

    function meta(b){return (b&&b.meta)||b||{}}
    function load(append){if(loadEl)loadEl.style.display='';fetch(base+q(),{headers:{accept:'application/json'}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(b){if(loadEl)loadEl.style.display='none';var recs=Array.isArray(b&&b.data)?b.data:[];var m=meta(b);render(recs,append);if(countEl&&m.total!=null)countEl.textContent=m.total+' result'+(m.total===1?'':'s');if(emptyEl)emptyEl.style.display=(!append&&recs.length===0)?'':'none';if(lm&&m.hasMore!=null)lm.style.display=m.hasMore?lmDisp:'none';}).catch(function(){if(loadEl)loadEl.style.display='none';if(append)st.page=Math.max(1,st.page-1);});}

    if(fmul.length){fetch(base+'/filter-presets',{headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():null}).then(function(p){if(!p)return;var pre=p.data||p;Array.prototype.forEach.call(fmul,function(box){var k=box.getAttribute('data-dyn-filter-multi');var panel=box.querySelector('[data-dyn-multi-panel]');var os=pre[k];if(!panel)return;if(!os||!os.length){box.style.display='none';return}box.style.display='';os.forEach(function(o){var lab=document.createElement('label');lab.style.cssText='display:flex;gap:6px;align-items:center;padding:3px 4px;font-size:14px;cursor:pointer';var c=document.createElement('input');c.type='checkbox';c.value=o.value;var t=document.createElement('span');t.textContent=o.value+(o.count!=null?' ('+o.count+')':'');lab.appendChild(c);lab.appendChild(t);panel.appendChild(lab);c.addEventListener('change',function(){var picked=[];Array.prototype.forEach.call(panel.querySelectorAll('input[type=checkbox]'),function(x){if(x.checked)picked.push(x.value);});if(picked.length)st.filters[k]=picked;else delete st.filters[k];multiLabel(box);changed();});});multiSync(box);});}).catch(function(){});}

    if(ss)ss.addEventListener('change',function(){var v=(ss.value||'').split(':');st.sortBy=v[0]||null;st.sortOrder=v[1]||'asc';changed();});
    if(si){var t;si.addEventListener('input',function(){clearTimeout(t);t=setTimeout(function(){st.search=si.value;changed();},300);});}

    load(false);
  }
  function run(){
    var nodes=document.querySelectorAll('[data-dyn-url]');

      // is the bake step (strips any author/import-injected data-dyn-url and
      // only ever emits a registry-resolved, allow-listed, @Public() no-credential
      // endpoint URL — see the sibling test asserting that), not the URL's origin.
      // The deployed page's own domain and api-services-public are legitimately
      // different origins (SERVICES_API_URL bakes an absolute cross-origin URL),

})();</script>
