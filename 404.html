<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<script>
(function () {
  var LOCALES = ['en-us'];          // every locale of this site, lowercase
  var DEFAULT = '/en-US';
  var p = location.pathname.replace(/\/+$/, '');
  var first = (p.split('/')[1] || '').toLowerCase();
  var target = (p === '' || LOCALES.indexOf(first) !== -1)
    ? DEFAULT                       // site root, or a missing page inside a locale: go home
    : DEFAULT + p.replace(/(\/index)?\.html?$/i, '');
  location.replace(target + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=/en-US">
</head><body><a href="/en-US">Continue</a></body></html>
